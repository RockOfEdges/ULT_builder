<!DOCTYPE html>
<html>
<head>
    <title>ULT Builder v0.1</title>
    <style>
        body {
            padding-left: 10px;
            padding-right: 10px;
            margin-bottom: 300px;
            /* font-size: large; */
        }

        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        td, #finalSentence {
            white-space: pre-line;
        }

        th, td {
            padding: 5px;
        }

        td:empty {
            background-color: #cccccc;
        }

        #tblAugments {
            width: 100%;
            table-layout: fixed;
        }

        #tblAugments th, #tblAugments td {
            word-wrap: break-word;
        }

        #tblAugments tr td:nth-child(1) {
            padding: 0;
            text-align: center;      /* Horizontally centers inline content */
            vertical-align: middle;  /* Vertically centers inline content */
        }

        #tblAugments input[type="checkbox"]{
            scale: 1.4;
        }

        #floatingWindow {
            position: fixed;
            left: 0px;
            bottom: 0px;
            width: 99%;
            min-height: 250px;
            padding: 10px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: bottom 0.2s ease-in;
        }

        #tblOptions, #tblOptions td {
            border: 0px;
        }

        #tblOptions {
            margin-top: 20px;
        }

        #finalSentence{
            width: 60%;
            font-size: larger;
        }
    </style>
</head>
<body>
    <h1>ULT Builder v0.1</h1>
    <table id="tblAugments">
        <thead>
            <tr>
                <th style="width: 3%;">
                    Select
                </th>
                <th>
                    Augment
                </th>
                <th>
                    Type
                </th>
                <th style="width: 40%;">
                    A
                </th>
                <th style="width: 40%;">
                    B
                </th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <div id="floatingWindow">
        <button id="btnShowHide" onclick="toggleFloatingWindow()">Hide</button>
        <h2>SELECTED AUGMENTS</h2>
        <table id="tblSelectedAugments">
            <thead>
                <tr>
                    <th>
                        Augment
                    </th>
                    <th>
                        Type
                    </th>
                    <th style="width: 40%;">
                        A
                    </th>
                    <th style="width: 40%;">
                        B
                    </th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
        <table id="tblOptions">
            <tbody>
                <tr hidden>
                    <td style="width: 5%;">Spell:</td>
                    <td><input id="inputSpellName"></td>
                </tr>
                <tr hidden>
                    <td>Type:</td>
                    <td>
                        <div style="display: flex;">
                            <select id="selectType">
                                <option value="Attack" selected>Attack</option>
                                <option value="Save">Save</option>
                                <option value="Hit">Hit</option>
                            </select>
                        </div>
                    </td>
                </tr>
                <tr hidden>
                    <td style="width: 5%;">Effect:</td>
                    <td>
                        <div style="display: flex;">
                            <select id="selectOptionEffect">
                                
                            </select>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        <h2>FINAL SENTENCE</h2>
        <div id="finalSentence"></div>
    </div>
</body>
<script>
    let data;
    let customSpellName = "";
    async function loadData() {
        try {
            const response = await fetch('./data.json');
            data = await response.json();
            console.log(data);
        } catch (error) {
            console.error("Could not fetch the JSON file:", error);
        }

        const tblData = document.getElementById("tblData");
        const tblAugments = document.getElementById("tblAugments");
        for (let i = 0; i < data.length; i++){
            const newRow2 = tblAugments.insertRow(-1);
            const select = newRow2.insertCell(0);
            const name2 = newRow2.insertCell(1);
            const type2 = newRow2.insertCell(2);
            const a2 = newRow2.insertCell(3);
            const bDesc2 = newRow2.insertCell(4);
            select.innerHTML = "<input type='checkbox' data-index='" + i +"'>";
            name2.textContent = data[i].name;
            type2.textContent = data[i].type;
            a2.textContent = data[i].aDesc;
            if (data[i].tooltip != ""){
                a2.textContent += "\n\n" + data[i].tooltip;
            }
            bDesc2.textContent = data[i].bDesc;
        }

        const checkboxes = document.querySelectorAll('#tblAugments input[type="checkbox"]');
        checkboxes.forEach((checkbox) => {
            checkbox.addEventListener('change', (event) => {
                updateSelectedAugments(checkbox.dataset.index, event.target.checked);
            });
        });
    }

    loadData();
    document.getElementById("inputSpellName").oninput = function(e) {
        customSpellName = e.target.value;
        updateFinalSentence();
    };
    document.getElementById("selectType").addEventListener("change", function(){
        updateFinalSentence();
    });
    document.getElementById("selectOptionEffect").addEventListener("change", function(){
        updateFinalSentence();
    });

    function updateSelectedAugments(index, isChecked){
        // console.log(index + ", " + isChecked);
        const tblSelectedAugments = document.getElementById("tblSelectedAugments");

        if (isChecked){
            const newRow = tblSelectedAugments.insertRow(-1);
            newRow.id = "rSelectedAugment" + index;
            const name = newRow.insertCell(0);
            const type = newRow.insertCell(1);
            const a = newRow.insertCell(2);
            const b = newRow.insertCell(3);
            name.textContent = data[index].name;
            type.textContent = data[index].type;

            if (data[index].aDesc != ""){
                a.onclick = function(){
                    updateSelectedAugmentsOptions(this);
                    updateFinalSentence();
                };
                
                if (data[index].tooltip != ""){
                    a.innerHTML = "<input type='radio' name='aOptions' value=" + index + ">" + data[index].aDesc + "\n\n" + data[index].tooltip;;
                } else {
                    a.innerHTML = "<input type='radio' name='aOptions' value=" + index + ">" + data[index].aDesc;
                }
            }
            
            if (data[index].bDesc != ""){
                b.onclick = function(){
                    updateSelectedAugmentsOptions(this);
                    updateFinalSentence();
                };
                b.innerHTML = "<input type='radio' name='bOptions' value=" + index + ">" + data[index].bDesc;
            }
            
        } else {
            document.getElementById("rSelectedAugment" + index).remove();
        }
        updateFloatingWindowPosition();
    }

    let isFloatingWindowHidden = false;
    const floatingWindowTransition = window.getComputedStyle(floatingWindow).getPropertyValue('transition');
    function toggleFloatingWindow(){
        const floatingWindow = document.getElementById("floatingWindow");
        floatingWindow.style.transition = floatingWindowTransition;
        const btnShowHide = document.getElementById("btnShowHide");
        const height = floatingWindow.offsetHeight - 30;
        if (isFloatingWindowHidden){
            floatingWindow.style.bottom = "0px";
            btnShowHide.textContent = "Hide";
        } else {
            floatingWindow.style.bottom = "-" + height + "px";
            btnShowHide.textContent = "Show";
        }
        isFloatingWindowHidden = !isFloatingWindowHidden;
    }

    function updateFloatingWindowPosition(){
        const floatingWindow = document.getElementById("floatingWindow");
        floatingWindow.style.transition = "none";
        const height = floatingWindow.offsetHeight - 30;
        if (isFloatingWindowHidden){
            floatingWindow.style.bottom = "-" + height + "px";
        }

        let bodyHeight = height + 50;
        // console.log("bodyHeight" + bodyHeight);
        document.body.style.marginBottom = bodyHeight + "px";
    }

    function updateSelectedAugmentsOptions(cell){
        cell.querySelector('input[type=radio]').checked = true;
    }

    function updateFinalSentence(){
        let aRadio = document.querySelector('input[name="aOptions"]:checked');
        let bRadio = document.querySelector('input[name="bOptions"]:checked');

        if (aRadio == null){
            return;
        }
        let aIndex = aRadio.value;

        let tblOptions = document.getElementById("tblOptions");
        tblOptions.rows[0].hidden = true;
        tblOptions.rows[1].hidden = true;
        tblOptions.rows[2].hidden = true;

        let a = data[aIndex].a;
        let type = data[aIndex].type;

        let hasCustomSpell = data[aIndex].tags.includes("customSpell");
        if (hasCustomSpell){
            tblOptions.rows[0].hidden = false;
            tblOptions.rows[1].hidden = false;

            type = document.getElementById("selectType").value;
            a = data[aIndex].a.replace("customSpell", customSpellName);
        } else {
            document.getElementById("inputSpellName").value = "";
            customSpellName = "";
        }

        let hasOptionEffect = data[aIndex].tags.includes("optionEffect");
        const selectOptionEffect = document.getElementById("selectOptionEffect");
        if (hasOptionEffect){
            tblOptions.rows[2].hidden = false;
            if (selectOptionEffect.options.length == 0){
                for (let i = 0; i < data[aIndex].optionEffects.length; i++){
                    selectOptionEffect.add(new Option(data[aIndex].optionEffects[i], data[aIndex].optionEffects[i]));
                }
            }

            let optionEffectLowercase = selectOptionEffect.value.toLowerCase();
            if (optionEffectLowercase.includes("attack")){
                type = "Attack";
            } else if (optionEffectLowercase.includes("saving throw")){
                type = "Save";
            }

            a = a.replace("optionEffect", selectOptionEffect.value);
        } else {
            selectOptionEffect.options.length = 0;
        }

        if (hasCustomSpell){
            if (customSpellName === ""){
                document.getElementById("finalSentence").textContent = "";
                return;
            }
        }

        if (bRadio == null){
            return;
        }
        let bIndex = bRadio.value;

        let b = "";
        if (type === "Attack"){
            b = data[bIndex].bAttack;
        } else if (type === "Save"){
            b = data[bIndex].bSave;
        } else if (type === "Hit"){
            b = data[bIndex].bHit;
        }

        if (a === "" || b === ""){
            document.getElementById("finalSentence").textContent = "";
            return;
        }

        // EDGE CASE, where A ends with a "." and B starts with a ".", remove the extra "."
        if (a.at(-1) === "." && b.at(0) === "."){
            b = b.slice(1);
        }

        let finalSentence = a;
        finalSentence += b;
        finalSentence += data[aIndex].aSave;
        finalSentence += "\n\n" + data[aIndex].tooltip;
        document.getElementById("finalSentence").textContent = finalSentence;
        updateFloatingWindowPosition();
    }
</script>
</html>
